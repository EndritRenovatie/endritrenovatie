<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Endrit Renovatie | Binnen & Buiten</title>
  <meta name="description" content="Endrit Renovatie - renovatie binnen en buiten, afbraakwerken en cleaning. Actief in heel België.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #ffffff;
      line-height: 1.6;
    }

    header {
      background: #111111;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 1px solid #c89b3c;
    }

    .brand {
      color: #d6ad55;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      margin-left: 20px;
    }

    nav a:hover {
      color: #d6ad55;
    }

    .hero {
      text-align: center;
      padding: 90px 20px;
      background: linear-gradient(135deg, #080808, #242424);
    }

    .hero h1 {
      color: #d6ad55;
      font-size: 46px;
      margin-bottom: 8px;
    }

    .hero h2 {
      font-size: 30px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 19px;
      margin-bottom: 8px;
    }

    .button {
      display: inline-block;
      background: #d6ad55;
      color: #111111;
      padding: 13px 22px;
      margin: 15px 5px 0;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }

    section {
      padding: 65px 8%;
    }

    section h2 {
      text-align: center;
      color: #d6ad55;
      font-size: 32px;
      margin-bottom: 35px;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .service {
      background: #171717;
      border: 1px solid #3c3425;
      padding: 28px 20px;
      border-radius: 10px;
      text-align: center;
    }

    .service h3 {
      color: #d6ad55;
      margin-bottom: 12px;
    }

    .about {
      background: #141414;
      text-align: center;
    }

    .about p {
      max-width: 850px;
      margin: auto;
      font-size: 18px;
    }

    .emergency {
      margin-top: 25px !important;
      color: #d6ad55;
      font-weight: bold;
    }

    .contact {
      text-align: center;
    }

    .contact p {
      margin: 8px 0;
      font-size: 18px;
    }

    .contact a {
      color: #d6ad55;
      text-decoration: none;
    }
